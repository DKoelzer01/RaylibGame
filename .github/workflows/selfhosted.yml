# Self-hosted runner on deweyserver (#1016): GPU checks, headless scenarios, the headless regression and the Linux server package.
# Trusted triggers ONLY: pushes to the integration branches, the nightly schedule and manual runs. Never pull_request or
# pull_request_target: a PR from anyone must not run code on the home server.
# Off until the repository variable SELF_HOSTED_ENABLED is "true" (Settings > Secrets and variables > Actions > Variables):
# while it is unset every job is skipped, so nothing waits in the queue for a runner that is not there. See .github/CI.md.
name: Self-hosted (deweyserver)

on:
  push:
    branches: [develop, m84-integration]
  schedule:
    - cron: "0 5 * * *" # nightly, 05:00 UTC (the schedule fires from the default branch's copy of this file)
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build and test (empty: the branch the run was started on)"
        required: false
        default: ""
        type: string
      regression:
        description: "Also run tools/regression.sh --only headless after the checks (the nightly does)"
        required: false
        default: none
        type: choice
        options: [none, headless]
      regression_sets:
        description: "Regression sets, space-separated (planet, eroded, multiplayer)"
        required: false
        default: planet multiplayer
        type: string
      fluid_pressure:
        description: "Run the headless scenarios with the fluid pressure pass on (#1168: RAYLIBGAME_FLUID_PRESSURE=1)"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      extra_scenarios:
        description: "Also run these scenarios after the headless parts (comma-separated names or tag:X, e.g. fluid/flow-meter; #1447)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # one GPU run at a time; a newer push waits instead of killing a run mid-test

# The nightly run builds this branch (a schedule always starts on the default branch, main, which lags); a manual run
# builds its `ref` input, else the branch it was started on.
env:
  REF: ${{ inputs.ref || (github.event_name == 'schedule' && (vars.NIGHTLY_BRANCH || 'm84-integration') || github.ref) }}

jobs:
  # The server package on its own (#1028): its result is what tools/ci/deweyserver-update-server.sh looks at, so a failing
  # scenario or regression test never holds back a server build whose build and unit tests passed.
  package:
    name: Linux server build, unit tests, package
    if: ${{ vars.SELF_HOSTED_ENABLED == 'true' && github.repository == 'DKoelzer01/RaylibGame' }}
    runs-on: [self-hosted, linux, raylibgame-linux, gpu]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Paths and version
        run: bash tools/ci/selfhosted_env.sh
      - name: Build the server (tools/build_linux.sh --inside, with GNS) and game_tests
        timeout-minutes: 60
        run: |
          start=$SECONDS
          bash tools/build_linux.sh --inside --out "$OUT" --jobs "$(nproc)"
          cmake --build "$OUT/build" -j "$(nproc)" --target game_tests
          echo "build: $((SECONDS - start)) s ($RAYLIBGAME_VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Unit tests (game_tests)
        timeout-minutes: 10
        run: |
          "$OUT/bin/game_tests" --gtest_brief=1
      - name: Upload the server package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raylibgame-server-linux-x86_64
          path: ${{ env.OUT }}/raylibgame-server-linux-x86_64.tar.gz
          retention-days: 5
          compression-level: 0 # already gzipped
          if-no-files-found: error

  linux-gpu:
    name: GPU check, headless scenarios, server and join tests
    needs: package
    runs-on: [self-hosted, linux, raylibgame-linux, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
          fetch-depth: 50 # (#1392) the push's base, for the changes gate below
      - name: Paths and version
        run: bash tools/ci/selfhosted_env.sh
      - name: Which GPU steps this push needs (#1392)
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # The GPU bit-exact check and the fluid parity only for shader, terrain, fluid, render or build changes; the
        # headless scenarios and the server and join tests always run; a schedule or a manual run runs everything.
        run: bash tools/ci/gpu_changes.sh
      - name: Build (incremental; another branch's run may have used the build folder in between)
        id: build
        timeout-minutes: 60
        run: |
          bash tools/build_linux.sh --inside --out "$OUT" --jobs "$(nproc)"
      - name: Run folder
        run: |
          # The game reads resources/ and assets/ from the working directory; saves/ (the erosion bake cache) persists here.
          ln -sfn "$GITHUB_WORKSPACE/resources" "$RUN/resources"
          ln -sfn "$GITHUB_WORKSPACE/assets" "$RUN/assets"
          rm -rf "$RUN/scenarios" "$RUN/join-logs"
          mkdir -p "$RUN/join-logs"
          # (#1447) The GPU's state every 5 s for the whole job (performance state, clocks, utilisation, memory, the
          # processes on it): the runner's fluid step ran ~35x slower than the PC's, and the GPU is shared by three runners.
          if command -v nvidia-smi > /dev/null; then
            nohup bash -c 'while :; do echo "$(date -u +%H:%M:%S),$(nvidia-smi --query-gpu=pstate,clocks.gr,clocks.max.gr,clocks.mem,utilization.gpu,memory.used,temperature.gpu,power.draw --format=csv,noheader,nounits 2>&1 | head -1),$(nvidia-smi --query-compute-apps=pid --format=csv,noheader 2>/dev/null | wc -l)"; sleep 5; done' \
              > "$RUN/gpu-samples.csv" 2>&1 &
            echo $! > "$RUN/gpu-sampler.pid"
          else
            echo "no nvidia-smi in the container" > "$RUN/gpu-samples.csv"
          fi
      - name: GPU context (EGL on the NVIDIA runtime)
        id: gpu
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.changes.outputs.gpu != 'false' }}
        timeout-minutes: 15
        working-directory: ${{ env.RUN }}
        run: |
          # The GPU bit-exact check: the GPU height map and density blocks against the CPU field (Plan 6, #146).
          set +e
          timeout 840 "$OUT/bin/game" --seed 42 --bench 3 --test-terrain-gpu > terrain-gpu.log 2>&1
          rc=$?
          set -e
          grep -E "HEADLESS|^bench: terrain gpu" terrain-gpu.log || true
          if grep -q "null GL" terrain-gpu.log; then
            echo "::error::No GPU context (null GL): the runner container needs the NVIDIA runtime and NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility"
            exit 1
          fi
          if [ $rc -ne 0 ] || grep -q "FAIL" terrain-gpu.log; then echo "::error::--test-terrain-gpu failed (exit $rc)"; tail -40 terrain-gpu.log; exit 1; fi
          echo "terrain gpu: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Fluid CPU = GPU parity (informational until #968's residual is fixed)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.changes.outputs.gpu != 'false' }}
        continue-on-error: true
        timeout-minutes: 30
        working-directory: ${{ env.RUN }}
        run: |
          # The shader's half rounding (packHalf2x16, the stored face flows) against the CPU kernel's, 1M floats (#968).
          set +e
          bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" shared 1200 -- timeout 300 "$OUT/bin/game" --seed 42 --bench 1 --sandbox --test-half > half.log 2>&1
          grep -E "^bench: half" half.log || true
          echo "half rounding: $(grep -E '^bench: half: [0-9]+ floats' half.log | sed -E 's/^bench: half: //')" >> "$GITHUB_STEP_SUMMARY"
          # fluid/flow run twice in lockstep (GPU, then FLUID_CPU=1), a hash of every brick's cells each tick, compared (#968).
          bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" shared 1200 -- "$OUT/bin/game" --scenario-parity fluid/flow 400 --scenario-out "$RUN/scenarios/parity" > parity.log 2>&1
          rc=$?
          # The pressure pass (#1168) the same way: the U-bend with the pass on, GPU against CPU.
          bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" shared 1200 -- "$OUT/bin/game" --scenario-parity fluid/u-bend-pressure 400 --scenario-out "$RUN/scenarios/parity-pressure" > parity-pressure.log 2>&1
          set -e
          grep -E "^scenario: parity" parity.log || true
          grep -E "^scenario: parity" parity-pressure.log || true
          echo "fluid parity: $(grep -E '^scenario: parity .* -> ' parity.log | tail -1 | sed -E 's/^scenario: parity //')" >> "$GITHUB_STEP_SUMMARY"
          echo "fluid parity, pressure pass: $(grep -E '^scenario: parity .* -> ' parity-pressure.log | tail -1 | sed -E 's/^scenario: parity //')" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      # (#1367) The scenarios in two steps with their own timeouts: one step had ~39 of its 45 min taken by the scenarios
      # alone, so one slow or frozen scenario (each still has its hard per-scenario cap) took the rest down with it. The
      # halves share no scenario (no file carries tags from both lists): fluid, frames and factory (~20 min), then the rest.
      - name: Headless scenarios, part 1 (fluid, frames, factory)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        working-directory: ${{ env.RUN }}
        env:
          RAYLIBGAME_TIMING_GATES: "0" # #1034: timing gates are reported, not judged, on this shared machine
          RAYLIBGAME_FLUID_PRESSURE: ${{ inputs.fluid_pressure || '0' }} # #1168: the pressure pass for every fluid scene, when asked
        run: |
          # Every match runs in its own process; perf scenarios are left out (timing belongs on a quiet machine, this PC).
          set +e
          bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" shared 1200 -- "$OUT/bin/game" --scenario tag:fluid,tag:frames,tag:factory --scenario-no-record --scenario-out "$RUN/scenarios/part1" \
            > scenarios-1.log 2>&1
          rc=$?
          set -e
          grep -E "^scenario: " scenarios-1.log | grep -vE "heartbeat|waiting" | tail -80 || true
          echo "scenarios part 1: exit $rc" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Headless scenarios, part 2 (craft, skills, world, caves, combat, creatures)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        working-directory: ${{ env.RUN }}
        env:
          RAYLIBGAME_TIMING_GATES: "0"
          RAYLIBGAME_FLUID_PRESSURE: ${{ inputs.fluid_pressure || '0' }}
        run: |
          set +e
          bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" shared 1200 -- "$OUT/bin/game" --scenario tag:craft,tag:skills,tag:world,tag:caves,tag:combat,tag:creatures --scenario-no-record --scenario-out "$RUN/scenarios/part2" \
            > scenarios-2.log 2>&1
          rc=$?
          set -e
          grep -E "^scenario: " scenarios-2.log | grep -vE "heartbeat|waiting" | tail -80 || true
          echo "scenarios part 2: exit $rc" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Extra scenarios (the dispatch input extra_scenarios, #1447)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.extra_scenarios != '' }}
        timeout-minutes: 90 # (up to 45 min waiting for the GPU to itself: tools/ci/gpu_lock.sh)
        working-directory: ${{ env.RUN }}
        env:
          RAYLIBGAME_TIMING_GATES: "0"
          EXTRA: ${{ inputs.extra_scenarios }}
        run: |
          # Scenarios that are local-only (timing) can be measured here on request; their start and end times line up with
          # the GPU samples (gpu-samples.csv). Labels only: a failure here doesn't fail the job.
          echo "extra scenarios start: $(date -u +%H:%M:%S)" | tee -a "$GITHUB_STEP_SUMMARY"
          set +e
          bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" exclusive 2700 -- "$OUT/bin/game" --scenario "$EXTRA" --scenario-no-record --scenario-out "$RUN/scenarios/extra" > scenarios-extra.log 2>&1
          set -e
          echo "extra scenarios end: $(date -u +%H:%M:%S)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "^scenario: [a-z0-9_/-]+ -> " scenarios-extra.log | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Perf budgets (report-only)
        # (#1690) The tag:budget scenes 3 times with the GPU to ourselves, the median of each metric against
        # tools/ci/perf_budgets.txt. Report-only: continue-on-error stays until the user turns blocking on (then drop it and
        # set PERF_BUDGETS_ENFORCE to 1: a miss over 20% fails the step, up to 20% only warns). Timing gates stay off.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 120 # (up to 30 min waiting for the lock per run, then ~2 min per scene)
        working-directory: ${{ env.RUN }}
        env:
          RAYLIBGAME_TIMING_GATES: "0"
          PERF_BUDGETS_ENFORCE: "0"
        run: |
          set +e
          dirs=()
          locked=1
          for i in 1 2 3; do
            bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" exclusive 1800 -- "$OUT/bin/game" --scenario tag:budget --scenario-no-record --scenario-out "$RUN/scenarios/budget$i" \
              > "perf-budget-$i.log" 2> "perf-budget-lock-$i.log"
            cat "perf-budget-lock-$i.log" >> "perf-budget-$i.log"
            grep -q "NOT taken" "perf-budget-lock-$i.log" && locked=0
            dirs+=("$RUN/scenarios/budget$i")
          done
          grep -hE "^scenario: " perf-budget-[0-9].log | grep -vE "heartbeat|waiting" | tail -40 || true
          if [ $locked = 0 ]; then
            # the GPU stayed busy: the numbers are not clean, so nothing is judged (they are still listed)
            PERF_BUDGETS_ENFORCE=0 PERF_BUDGETS_NOTE="Not judged: the GPU lock timed out, so these runs shared the GPU." bash "$GITHUB_WORKSPACE/tools/ci/perf_budgets.sh" "${dirs[@]}"
            exit 0
          fi
          PERF_BUDGETS_NOTE="GPU clocks, utilisation and temperature over the job: see the 'GPU over the job' summary below (gpu-samples.csv in the results)." \
            bash "$GITHUB_WORKSPACE/tools/ci/perf_budgets.sh" "${dirs[@]}"
      - name: Dedicated server and multiplayer (test_server.sh, test_join.sh)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        env:
          TMPDIR: ${{ env.RUN }}/join-logs # the scripts' mktemp -d folders (host and client logs) land in the uploaded results
        run: |
          EXE="$OUT/bin/game" bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" shared 1200 -- bash tools/test_server.sh
          EXE="$OUT/bin/game" bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" shared 1200 -- bash tools/test_join.sh
      - name: Failures, known or NEW (#1479)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Each "-> FAIL" line of the run's logs, marked "known (#N)" from tools/ci/known_failures.txt or "NEW", into the job
        # summary (the runner-check skill's matching). Labels only: the steps above carry the verdicts.
        run: |
          bash tools/ci/mark_failures.sh "$RUN/scenarios-1.log" "$RUN/scenarios-2.log" "$RUN/parity.log" "$RUN/parity-pressure.log" \
            "$RUN/half.log" "$RUN/terrain-gpu.log" "$RUN/join-logs"
      - name: GPU state over the job (#1447)
        if: ${{ !cancelled() }}
        run: |
          [ -f "$RUN/gpu-sampler.pid" ] && kill "$(cat "$RUN/gpu-sampler.pid")" 2> /dev/null || true
          f="$RUN/gpu-samples.csv"
          [ -s "$f" ] || exit 0
          # time, pstate, clock MHz, max clock MHz, memory clock MHz, utilisation %, memory MiB, temperature, power W, processes
          {
            echo ""; echo "### GPU over the job (#1447): $(wc -l < "$f") samples, every 5 s"
            echo '```'
            awk -F', *' 'NF >= 9 { n++; p[$2]++; u += $6; c += $3; if ($6 > 90) busy++; if ($10 > m) m = $10 }
                          END { if (!n) { print "no samples"; exit }
                                printf "clock %.0f MHz mean (max %s); utilisation %.0f%% mean, >90%% in %d of %d samples; up to %d processes\n", c/n, $4, u/n, busy, n, m
                                for (s in p) printf "  %s: %d samples\n", s, p[s] }' "$f"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the run summary for the deweyserver MCP tools (ci_summary, scenario_history; #1476)
        if: ${{ !cancelled() }}
        run: bash tools/ci/save_summary.sh gpu
      - name: Upload test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfhosted-test-results
          path: |
            ${{ env.RUN }}/scenarios/
            ${{ env.RUN }}/terrain-gpu.log
            ${{ env.RUN }}/scenarios-*.log
            ${{ env.RUN }}/gpu-samples.csv
            ${{ env.RUN }}/join-logs/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  # The headless half of the nightly regression (#1028): tools/regression.sh --only headless on the Linux build. The other
  # half (--only local: rendering, camera feel, perf and timing) stays on the PC. Nightly, or a manual run with
  # regression = headless; never on pushes. After the checks above, also when one of them failed. Split into 4 shards
  # (--shard I/4, every 4th test), one job each of ~35-40 min on the runner, so other runs get the one GPU runner in
  # between. A shard fails only on new failures: the ones in tools/regression_known.txt (with their issues) are reported apart.
  regression:
    name: Regression (--only headless, shard ${{ matrix.shard }}/4)
    needs: [package, linux-gpu]
    if: ${{ !cancelled() && needs.package.result == 'success' && (github.event_name == 'schedule' || inputs.regression == 'headless') }}
    runs-on: [self-hosted, linux, raylibgame-linux, gpu]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SETS: ${{ inputs.regression_sets || 'planet multiplayer' }} # (#1367) the net tests too: they had not run since they moved to their own set
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Paths and version
        run: bash tools/ci/selfhosted_env.sh
      - name: Build (incremental; another branch's run may have used the build folder in between)
        timeout-minutes: 30
        run: |
          bash tools/build_linux.sh --inside --out "$OUT" --jobs "$(nproc)"
      - name: Run folder
        run: |
          ln -sfn "$GITHUB_WORKSPACE/resources" "$RUN/resources"
          ln -sfn "$GITHUB_WORKSPACE/assets" "$RUN/assets"
      - name: tools/regression.sh --only headless --shard
        timeout-minutes: 80
        run: |
          # The run folder keeps saves/ (the erosion bake of seed 42 is cached there after the first night).
          for s in $SETS; do
            case "$s" in planet|eroded|multiplayer) ;; *) echo "::error::unknown regression set '$s'"; exit 2 ;; esac
          done
          log="$RUN/regression-$SHARD.log"
          set +e
          start=$SECONDS
          for s in $SETS; do
            RUNDIR="$RUN" EXE="$OUT/bin/game" EXE_GNS="$OUT/bin/game" GNS=1 bash "$GITHUB_WORKSPACE/tools/ci/gpu_lock.sh" shared 1200 -- bash tools/regression.sh "$s" --only headless --shard "$SHARD/4"
          done 2>&1 | tee "$log"
          {
            echo "## Regression --only headless, shard $SHARD/4 ($SETS, $RAYLIBGAME_VERSION)"
            echo "$(( (SECONDS - start) / 60 )) min in all"
            echo
            bash tools/ci/regression_summary.sh "$log" tools/regression_known.txt
          } > "$RUN/regression-summary-$SHARD.md"
          rc=$? # 1 when a failure is not in tools/regression_known.txt
          set -e
          cat "$RUN/regression-summary-$SHARD.md" >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q "^=== regression (" "$log"; then echo "::error::the regression did not finish"; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "::error::new regression failures (not in tools/regression_known.txt): see the job summary"; fi
          exit "$rc"
      - name: Save the run summary for the deweyserver MCP tools (#1476)
        if: ${{ !cancelled() }}
        run: bash tools/ci/save_summary.sh regression-${{ matrix.shard }}
      - name: Upload the regression log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-headless-log-${{ matrix.shard }}
          path: |
            ${{ env.RUN }}/regression-${{ matrix.shard }}.log
            ${{ env.RUN }}/regression-summary-${{ matrix.shard }}.md
          retention-days: 14
          if-no-files-found: ignore
